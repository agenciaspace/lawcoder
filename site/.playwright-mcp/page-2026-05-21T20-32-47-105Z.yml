        - heading "Assistentes Inteligentes para a Área Jurídica" [level=1] [ref=e50]
        - paragraph [ref=e51]: Como qualquer pessoa que trabalha com direito pode usar ferramentas de IA para criar apps, automatizar tarefas e resolver problemas — sem saber programar.
        - generic [ref=e52]:
          - generic [ref=e53]:
            - generic [ref=e54]: "10"
