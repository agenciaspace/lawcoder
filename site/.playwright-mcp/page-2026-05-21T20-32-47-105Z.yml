      - heading "O Que Você Vai Aprender" [level=2] [ref=e59]
      - paragraph [ref=e60]:
        - text: Este curso é para
        - strong [ref=e61]: qualquer pessoa que trabalha na área jurídica
        - text: ": advogados, estagiários, secretários, assistentes, gestores de escritório, departamentos jurídicos de empresas. Você não precisa saber nada de programação."
      - paragraph [ref=e62]:
        - text: Você vai aprender a usar ferramentas que
        - strong [ref=e63]: criam coisas para você
        - text: ":"
      - list [ref=e64]:
        - listitem [ref=e65]:
          - strong [ref=e66]: Aplicativos
          - text: para calcular prazos, gerar documentos, organizar processos
        - listitem [ref=e67]:
          - strong [ref=e68]: Assistentes automáticos
          - text: que trabalham sozinhos enquanto você faz outra coisa
        - listitem [ref=e69]:
          - strong [ref=e70]: Automações
          - text: para eliminar tarefas repetitivas do seu dia
      - heading "O Que Mudou em 2025" [level=2] [ref=e71]
      - paragraph [ref=e72]:
        - text: Até pouco tempo atrás, criar um app ou automatizar uma tarefa exigia contratar um programador. Hoje, existem ferramentas onde você
        - strong [ref=e73]: descreve o que quer em português
        - text: e elas criam sozinhas.
      - paragraph [ref=e75]:
        - strong [ref=e76]: "Pense assim:"
        - text: antes, você ditava para um estagiário e ele escrevia a petição. Agora, você descreve para uma ferramenta de IA e ela
        - strong [ref=e77]: cria um app inteiro
        - text: que faz o trabalho automaticamente.
      - heading "Três Tipos de Ferramentas Que Você Vai Conhecer" [level=2] [ref=e78]
      - generic [ref=e79]:
        - heading "1. Ferramentas de Chat com Superpoderes" [level=3] [ref=e80]
        - paragraph [ref=e81]:
          - text: Como o Claude Desktop, o ChatGPT ou o Gemini. Você conversa, mas elas podem
          - strong [ref=e82]: usar programas no seu computador
          - text: ", ler arquivos, navegar na internet e criar projetos completos."
      - generic [ref=e83]:
        - heading "2. Editores de Código com IA" [level=3] [ref=e84]
        - paragraph [ref=e85]:
          - text: Programas como o
          - strong [ref=e86]: Cursor
          - text: ","
          - strong [ref=e87]: Windsurf
          - text: ou o VS Code com GitHub Copilot. Eles são como um Word, mas para criar apps. A IA escreve o código enquanto você dita o que quer.
      - generic [ref=e88]:
        - heading "3. Ferramentas de Linha de Comando (CLIs)" [level=3] [ref=e89]
        - paragraph [ref=e90]:
          - text: Programas que você usa digitando no terminal. Parece assustador, mas é só um
          - strong [ref=e91]: chat de texto mais direto
          - text: . Você digita um comando e a ferramenta cria ou faz algo.
      - heading "Por Que a Área Jurídica Precisa Disso" [level=2] [ref=e92]
      - list [ref=e93]:
        - listitem [ref=e94]:
          - strong [ref=e95]: "Prazos processuais:"
          - text: calculados automaticamente por um app que você criou
        - listitem [ref=e96]:
          - strong [ref=e97]: "Documentos repetitivos:"
          - text: gerados em segundos com seus modelos personalizados
        - listitem [ref=e98]:
          - strong [ref=e99]: "Pesquisa jurisprudencial:"
          - text: organizada e resumida automaticamente
        - listitem [ref=e100]:
          - strong [ref=e101]: "Controle de processos:"
          - text: um sistema seu, do jeito que você quer
        - listitem [ref=e102]:
          - strong [ref=e103]: "Tarefas administrativas:"
          - text: eliminadas com automações simples
      - paragraph [ref=e105]:
        - strong [ref=e106]: Você não vai virar programador.
        - text: Você vai virar alguém que sabe usar ferramentas inteligentes para criar soluções próprias. É como saber usar Excel avançado — só que para criar apps.
